name: MNQ H24 MAE AXB transfer compute

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach acf15107bdeef4a50502bf89dd089b8dd706a78e
          test "$(git -C harness rev-parse HEAD)" = "acf15107bdeef4a50502bf89dd089b8dd706a78e"

      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"

      - name: Checkout exact AXB source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/axb0306/cme-futures-ohlc.git axb
          git -C axb checkout --detach 60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264
          test "$(git -C axb rev-parse HEAD)" = "60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264"

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Execute independent-source MAE ranking transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cd harness
          python -m research.mnq_h24_mae_axb_transfer \
            --deep-root ../deep/plaintext_csv \
            --axb-root ../axb \
            --output ../result/receipt.json

      - name: Print compact receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('result/receipt.json'))
          print('RECEIPT_SHA256='+d['receipt_sha256'])
          for side in ('long','short'):
              s=d['sides'][side]
              print(side, 'pearson=', s['pearson_predicted_vs_realized_mae_z'], 'spearman=', s['spearman_predicted_vs_realized_mae_z'])
              print(side, 'monthly=', [(m['month'],m['pearson'],m['spearman']) for m in s['monthly']])
          PY

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: mnq-h24-mae-axb-transfer
          path: result/receipt.json
          if-no-files-found: error
          retention-days: 30
