name: mnq-h24-source-parity-timefixed

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact timestamp-corrected parity harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach c67de599a5809134b82571c7173ce3cf329c3e20
          test "$(git -C harness rev-parse HEAD)" = "c67de599a5809134b82571c7173ce3cf329c3e20"

      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176

      - name: Checkout exact AXB source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/axb0306/cme-futures-ohlc.git axb
          git -C axb checkout --detach 60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn tzdata

      - name: Execute timestamp-corrected source parity
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p result
          cd harness
          python -m research.mnq_h24_source_parity_timefixed \
            --deep-root ../deep/plaintext_csv \
            --axb-root ../axb \
            --output ../result/mnq-h24-source-parity-timefixed.json \
            2>&1 | tee ../result/mnq-h24-source-parity-timefixed.log
          rc=${PIPESTATUS[0]}
          echo "PARITY_TIMEFIXED_EXIT_CODE=$rc" | tee -a ../result/mnq-h24-source-parity-timefixed.log
          exit "$rc"

      - name: Upload metrics and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-h24-source-parity-timefixed
          path: result/
          if-no-files-found: error
          retention-days: 30
