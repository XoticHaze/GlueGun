name: mnq-expected-move-axb-2026

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach 22ae432f6a300eb997b80229b081c17c6a193897
          test "$(git -C harness rev-parse HEAD)" = "22ae432f6a300eb997b80229b081c17c6a193897"

      - name: Checkout exact deep MNQ training source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"

      - name: Checkout exact independent AXB MNQ test source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/axb0306/cme-futures-ohlc.git axb
          git -C axb checkout --detach 60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264
          test "$(git -C axb rev-parse HEAD)" = "60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn tzdata

      - name: Execute independent-source H24 confirmation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p result
          cd harness
          python -m research.mnq_expected_move_axb_2026 \
            --deep-root ../deep/plaintext_csv \
            --axb-root ../axb \
            --output ../result/h24_axb_2026.json \
            2>&1 | tee ../result/h24_axb_2026.log
          rc=${PIPESTATUS[0]}
          echo "AXB_FORWARD_EXIT_CODE=$rc" | tee -a ../result/h24_axb_2026.log
          exit "$rc"

      - name: Upload metrics and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-expected-move-axb-2026
          path: |
            result/h24_axb_2026.json
            result/h24_axb_2026.log
          if-no-files-found: error
          retention-days: 30
