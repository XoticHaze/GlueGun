name: nq-mnq-weekly-execution-target

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        config: [h12_vol10, h24_vol05]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach c4623b470fb4c08ee7f65da8fa1fa594eb3a59d0
          test "$(git -C harness rev-parse HEAD)" = "c4623b470fb4c08ee7f65da8fa1fa594eb3a59d0"

      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"

      - name: Download frozen CC0 NQ source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source result
          curl --fail --location --retry 4 --retry-all-errors \
            'https://www.kaggle.com/api/v1/datasets/download/tgtanalytics/nq-futures-1min-bar-2022-2025' \
            -o source/nq.zip
          unzip -q source/nq.zip -d source/unpacked
          mapfile -t csvs < <(find source/unpacked -type f -iname '*.csv' -print)
          test "${#csvs[@]}" -eq 1
          cp "${csvs[0]}" source/nq.csv
          test "$(sha256sum source/nq.csv | awk '{print $1}')" = "1577e60a7feab411e49da7a56c7052a64738cd1757cfd60aa11fd783ff43b60b"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn

      - name: Normalize exact NQ source
        shell: bash
        run: |
          set -euo pipefail
          cd harness
          python -m research.nq_cc0_corpus_audit \
            --input ../source/nq.csv \
            --output-json ../result/nq-audit.json \
            --output-normalized ../result/nq-normalized.csv.gz

      - name: Execute multi-year MNQ-target walkforward
        shell: bash
        env:
          CONFIG_KEY: ${{ matrix.config }}
        run: |
          set -euo pipefail
          cd harness
          python -m research.nq_mnq_weekly_execution_target \
            --config-key "$CONFIG_KEY" \
            --deep-root ../deep/plaintext_csv \
            --nq-normalized ../result/nq-normalized.csv.gz \
            --output "../result/${CONFIG_KEY}.json"

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: nq-mnq-weekly-target-${{ matrix.config }}
          path: result/${{ matrix.config }}.json
          if-no-files-found: error
          retention-days: 30
