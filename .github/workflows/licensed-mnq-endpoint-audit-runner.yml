name: Licensed MNQ endpoint audit runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/licensed-mnq-endpoint-audit-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach 592777a6fee22f1676be1450275f5fd1567e545f
          test "$(git -C harness rev-parse HEAD)" = "592777a6fee22f1676be1450275f5fd1567e545f"
          python -m py_compile harness/research/licensed_mnq_payload_endpoint_audit.py
          echo 'HARNESS_PIN=PASS'

      - name: Install bounded dependency
        run: python -m pip install --disable-pip-version-check -q pandas tzdata

      - name: Fetch exact licensed MNQ archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/mnq.zip
          echo '633eb4338a3aa60aedb542b12085acca29ff237c7cadff65442a638466f37667  source/mnq.zip' | sha256sum -c -
          unzip -q source/mnq.zip -d source/extracted
          echo "PAYLOAD_FILES=$(find source/extracted -type f | wc -l)"

      - name: Audit all payloads for residual windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PYTHONPATH=harness python -m research.licensed_mnq_payload_endpoint_audit \
            --root source/extracted \
            --output artifacts/receipt.json \
            2>&1 | tee artifacts/run.log

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: licensed-mnq-endpoint-audit-runner
          path: |
            artifacts/receipt.json
            artifacts/run.log
          if-no-files-found: error
          retention-days: 30
