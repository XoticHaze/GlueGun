name: mnq-model-family-challenge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        config: [h12_vol10, h24_vol05]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach 5fafa571590cfde33a7f4167b3b2972690cc3a59
          test "$(git -C harness rev-parse HEAD)" = "5fafa571590cfde33a7f4167b3b2972690cc3a59"

      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn tzdata

      - name: Execute model-family challenger
        shell: bash
        env:
          CONFIG_KEY: ${{ matrix.config }}
        run: |
          set -uo pipefail
          mkdir -p result
          cd harness
          python -m research.mnq_model_family_weekly_challenge \
            --config-key "$CONFIG_KEY" \
            --deep-root ../deep/plaintext_csv \
            --output "../result/${CONFIG_KEY}.json" \
            2>&1 | tee "../result/${CONFIG_KEY}.log"
          rc=${PIPESTATUS[0]}
          echo "CHALLENGE_EXIT_CODE=$rc" | tee -a "../result/${CONFIG_KEY}.log"
          exit "$rc"

      - name: Upload metrics and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-model-family-${{ matrix.config }}
          path: |
            result/${{ matrix.config }}.json
            result/${{ matrix.config }}.log
          if-no-files-found: error
          retention-days: 30
